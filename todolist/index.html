<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div id="storage-warning" class="banner banner-warn" role="alert" hidden>
      브라우저 저장소를 사용할 수 없어 새로고침 시 내용이 사라집니다.
    </div>

    <header class="header">
      <div class="header-top">
        <h1>오늘의 할일</h1>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크 모드로 전환">🌙</button>
      </div>
      <p id="greeting" class="greeting"></p>
      <p id="today" class="today"></p>
      <div id="progress" class="progress" role="progressbar" aria-label="오늘 진행률"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-text" class="progress-text"></p>
    </header>

    <section id="carry-over" class="banner banner-info" hidden>
      <span id="carry-over-text"></span>
      <div class="banner-actions">
        <button id="carry-accept" class="btn btn-primary" type="button">오늘로 가져오기</button>
        <button id="carry-discard" class="btn" type="button">버리기</button>
      </div>
    </section>

    <form id="add-form" class="add-form" novalidate>
      <label for="new-todo" class="sr-only">새 할일</label>
      <input id="new-todo" type="text" maxlength="100" autocomplete="off"
             placeholder="할일을 입력하세요" title="/ 키를 누르면 바로 입력할 수 있어요"
             aria-describedby="input-error">
      <button class="btn btn-primary" type="submit">추가</button>
    </form>
    <p id="input-error" class="input-error" role="alert"></p>

    <nav class="filters" aria-label="할일 필터">
      <button type="button" class="filter" data-filter="all">전체</button>
      <button type="button" class="filter" data-filter="active">진행 중</button>
      <button type="button" class="filter" data-filter="done">완료</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">📝</div>
      <p id="empty-text"></p>
    </div>

    <p id="celebrate" class="celebrate" hidden>🎉 오늘 할 일을 모두 끝냈어요!</p>

    <footer class="footer">
      <span id="remaining" aria-live="polite"></span>
      <div class="footer-actions">
        <button id="toggle-all" class="btn btn-text" type="button">모두 완료</button>
        <button id="clear-completed" class="btn btn-text" type="button">완료 항목 지우기</button>
      </div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" class="btn btn-text" type="button">되돌리기</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
